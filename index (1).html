<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JTSD PERFORMANCE NOVEMBER 26&#39;</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f5f7;--card:#fff;--fg:#14202b;--mut:#5d6b78;--bd:#d9e0e6;--acc:#0e7c86;--g:#1b7f4b;--gb:#dff1e7;--m:#8a5a00;--mb:#faebc8;--b:#b3261e;--bb:#fbe0dd;--n:#5d6b78;--nb:#e6ebef;--trk:#dde4ea;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161e;--card:#16212c;--fg:#e6edf3;--mut:#93a3b1;--bd:#263544;--acc:#4cc2cc;--g:#5fd48f;--gb:#173a29;--m:#f0b84a;--mb:#3d2f0e;--b:#ff8a80;--bb:#431d1a;--n:#93a3b1;--nb:#223140;--trk:#2a3a4a;--on:#06222a}}
:root[data-theme="dark"]{--bg:#0e161e;--card:#16212c;--fg:#e6edf3;--mut:#93a3b1;--bd:#263544;--acc:#4cc2cc;--g:#5fd48f;--gb:#173a29;--m:#f0b84a;--mb:#3d2f0e;--b:#ff8a80;--bb:#431d1a;--n:#93a3b1;--nb:#223140;--trk:#2a3a4a;--on:#06222a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 32px}
h1{font-size:19px;font-weight:600;margin:0}
.sub{color:var(--mut);margin:2px 0 14px}
.tabs{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--card);margin-bottom:14px}
.tabs button{font:inherit;font-weight:500;padding:8px 14px;border:0;background:none;color:var(--mut);cursor:pointer}
.tabs button+button{border-left:1px solid var(--bd)}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.tabs button:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:14px}
.strip>div{padding:12px 14px;border-left:1px solid var(--bd)}
.strip>div:first-child{border-left:0}
.lab{color:var(--mut);font-size:12.5px}
.big{font-size:26px;font-weight:600;line-height:1.2}
.sm{color:var(--mut);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-weight:500;color:var(--mut);font-size:12.5px}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.on{background:var(--nb)}
tbody tr:last-child td{border-bottom:0}
.nm{font-weight:500}
.tm{color:var(--mut);font-size:12px}
.pb{display:flex;align-items:center;gap:8px;min-width:140px}
.trk{position:relative;flex:1;height:8px;border-radius:4px;background:var(--trk)}
.fil{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.fil.lag{background:var(--b)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.75}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500}
.g{background:var(--gb);color:var(--g)}.m{background:var(--mb);color:var(--m)}.b{background:var(--bb);color:var(--b)}.n{background:var(--nb);color:var(--n)}
.flag{color:var(--m);font-size:12.5px}
tbody tr.lr td{border-bottom:0}
tbody tr.dly{cursor:default}
tbody tr.dly:hover{background:none}
tbody tr.dly.on{background:var(--nb)}
.dly td{padding:0 12px 10px;text-align:left;white-space:normal}
.dl{position:sticky;left:0;display:flex;flex-wrap:wrap;gap:4px;width:min(calc(100vw - 58px),1000px)}
.dc{display:inline-flex;flex-direction:column;align-items:center;min-width:34px;padding:2px 4px;border:1px solid var(--bd);border-radius:6px;font-size:12.5px;line-height:1.25}
.dt{align-self:center;margin-right:6px;color:var(--mut);font-size:12px}
.dc i{font-style:normal;font-size:10.5px;color:var(--mut)}
:root{--s1:#f8c9c4;--s1t:#8f1d16;--s2:#fbd3a8;--s2t:#7a3a00;--s3:#f6ecb0;--s3t:#6b5a00;--s4:#bfe6cd;--s4t:#0f5a33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#5a2420;--s1t:#ffb4ab;--s2:#5a3510;--s2t:#ffc58a;--s3:#4d4510;--s3t:#efe08a;--s4:#17492f;--s4t:#8fe0b0}}
:root[data-theme="dark"]{--s1:#5a2420;--s1t:#ffb4ab;--s2:#5a3510;--s2t:#ffc58a;--s3:#4d4510;--s3t:#efe08a;--s4:#17492f;--s4t:#8fe0b0}
.dc.s1{background:var(--s1);color:var(--s1t);border-color:transparent}
.dc.s2{background:var(--s2);color:var(--s2t);border-color:transparent}
.dc.s3{background:var(--s3);color:var(--s3t);border-color:transparent}
.dc.s4{background:var(--s4);color:var(--s4t);border-color:transparent}
.dc.s1 i,.dc.s2 i,.dc.s3 i,.dc.s4 i{color:inherit;opacity:.8}
.dc.we,.dc.we i{font-weight:700}
.dc.we i{opacity:1}
#vtabs{margin-right:10px}
@media (max-width:640px){#vtabs{margin-right:0;max-width:100%}}
.flt{display:flex;flex-wrap:wrap;gap:8px}
.flt input,.flt select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;min-width:0}
.flt input{flex:1 1 220px}.flt select{flex:0 1 190px;max-width:100%}
.flt input:focus-visible,.flt select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.cnt{margin:-6px 2px 8px}
.jb{font-weight:400;color:var(--mut)}
.eu{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap}
.stn{white-space:normal;min-width:170px;max-width:250px}
#stbl th,#stbl td,#ptbl th,#ptbl td{padding:9px 10px}
#stbl .dly td,#ptbl .dly td{padding:0 10px 10px}
#stbl th.pw,#ptbl th.pw{white-space:normal;min-width:150px}
#stbl .pb,#ptbl .pb{min-width:110px}
#stbl td.nc{width:250px;min-width:220px;padding:6px 10px;white-space:normal;cursor:default}
.nc textarea{display:block;width:100%;min-height:54px;box-sizing:border-box;font:inherit;font-size:13px;line-height:1.35;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;resize:vertical}
.nc textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.nc textarea[readonly]{background:transparent}
.nc .ns{display:block;min-height:15px;margin-top:2px;font-size:11.5px;color:var(--mut)}
.nc .ns.er{color:var(--b)}
#nmsg{margin:-4px 2px 8px}
#atbl tr.sub td,#atbl tr.tot td{font-weight:600;background:var(--nb);cursor:default}
#atbl tr.tot td{border-top:2px solid var(--bd)}
#atbl tbody tr.sub,#atbl tbody tr.tot{cursor:default}
#atbl th,#atbl td{padding:9px 10px}
#atbl .pb{min-width:130px}
#atbl .dly td{padding:0 10px 12px}
#atbl .ul{position:sticky;left:0;width:min(calc(100vw - 58px),1000px)}
#atbl .ul h3{font-size:13px;font-weight:600;margin:8px 0 6px}
#atbl .ut{min-width:0;width:100%}
#atbl .ut th,#atbl .ut td{padding:6px 10px;text-align:left;white-space:normal;border-bottom:1px solid var(--bd)}
#atbl .ut th.r,#atbl .ut td.r{text-align:right}
#atbl .ut tbody tr{cursor:default}
#atbl .ut tbody tr:hover{background:none}
#atbl .ut .mono{white-space:nowrap;font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;font-size:12.5px;color:var(--mut)}
.leg .dc{flex-direction:row;padding:2px 8px}
.det{padding:14px}
.det h2{font-size:16px;margin:0 0 2px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:8px 0 4px}
svg{display:block;width:100%;height:auto;max-height:230px}
.bar{fill:var(--acc);opacity:.85}.sp{fill:var(--b)}
.ideal{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:5 4;opacity:.7}
.ax{fill:var(--mut);font-size:10px}.lb{fill:var(--b);font-size:11px;font-weight:600}.il{fill:var(--mut);font-size:10.5px}
.note{color:var(--mut);font-size:12.5px;max-width:78ch}
.note p{margin:0 0 6px}
.up label{display:block;margin:8px 0;color:var(--mut)}.up input{font:inherit;max-width:100%;margin-top:3px}.up button{font:inherit;font-weight:500;padding:8px 14px;border:0;border-radius:8px;background:var(--acc);color:var(--on);cursor:pointer}.up .sm{margin-top:8px}
details.up>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-weight:600}
details.up>summary::-webkit-details-marker{display:none}
details.up>summary::before{content:"\25B8";color:var(--mut);display:inline-block;width:1em;transition:transform .15s}
details.up[open]>summary::before{transform:rotate(90deg)}
details.up[open]>summary{border-bottom:1px solid var(--bd)}
details.up>summary:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
details.up .us{flex:1 1 260px;min-width:0;font-weight:400;font-size:12.5px;color:var(--mut)}
details.up:not([open]) .us{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
<h1>Monitor performa sales leader</h1>
<p class="sub" id="sub"></p>
<div class="tabs" id="vtabs" role="group" aria-label="Tampilan"></div><div class="tabs" id="tabs" role="group" aria-label="Tipe penjualan"></div>
<details class="box up" id="updet"><summary><span>Hitung dari file</span><span class="us" id="umsg">Upload Excel untuk memperbarui data. Klik untuk buka atau tutup.</span></summary><div class="det"><label>File SCAN AKTIF (sheet SOLD untuk pencapaian, sheet AKTIF untuk cek aktif belum scan)<br><input type="file" id="f1" accept=".xlsx,.xls"></label><label>File SOLD bulan lalu, opsional (untuk pencapaian V80 Lite bulan lalu)<br><input type="file" id="f2" accept=".xlsx,.xls"></label><label>File target per toko (sheet "Target Toko"). Tanpa file ini semua toko bertarget 0.<br><input type="file" id="f3" accept=".xlsx,.xls"></label><label>File target promotor (sheet "Target Promotor"). Tanpa file ini semua promotor bertarget 0.<br><input type="file" id="f4" accept=".xlsx,.xls"></label><button id="go">Hitung pencapaian</button><div class="sm" id="msg" role="status"></div></div></details>
<div class="strip" id="strip"></div>
<div class="leg" role="group" aria-label="Keterangan warna pencapaian harian"><span>Warna pencapaian harian dibanding target harian:</span><span class="dc s1">di bawah 50%</span><span class="dc s2">50 sampai 74%</span><span class="dc s3">75 sampai 99%</span><span class="dc s4">100% atau lebih</span><span><b>Angka tebal</b> = Sabtu dan Minggu</span></div>
<div id="lview"><div class="box"><div class="scroll"><table id="tbl"></table></div></div></div>
<div id="sview" hidden>
<div class="box"><div class="det flt">
<input type="search" id="sq" placeholder="Cari toko atau catatan" aria-label="Cari nama toko atau isi catatan" autocomplete="off">
<select id="sl" aria-label="Filter leader"></select>
<select id="sc" aria-label="Filter channel"></select>
<select id="ss" aria-label="Filter status"><option value="">Semua status</option><option value="z">Belum ada penjualan</option><option value="t">Tertinggal</option><option value="w">Waspada</option><option value="j">Di jalur</option><option value="x">Tanpa target</option></select>
<select id="sn" aria-label="Filter catatan"><option value="">Semua toko</option><option value="y">Sudah ada catatan</option><option value="n">Belum ada catatan</option></select>
<select id="so" aria-label="Urutkan"><option value="est">Urut: estimasi terendah</option><option value="esth">Urut: estimasi tertinggi</option><option value="ach">Urut: achieve terbanyak</option><option value="tgt">Urut: target terbesar</option><option value="nm">Urut: nama toko</option></select>
</div></div>
<div class="sm cnt" id="scnt" role="status"></div>
<div class="sm cnt" id="nmsg" role="status"></div>
<div class="box"><div class="scroll"><table id="stbl"></table></div></div>
</div>
<div id="pview" hidden>
<div class="box"><div class="det flt">
<input type="search" id="pq" placeholder="Cari promotor atau toko" aria-label="Cari nama promotor atau toko" autocomplete="off">
<select id="pl" aria-label="Filter leader"></select>
<select id="pj" aria-label="Filter jabatan"></select>
<select id="ps" aria-label="Filter status"><option value="">Semua status</option><option value="z">Belum ada penjualan</option><option value="t">Tertinggal</option><option value="w">Waspada</option><option value="j">Di jalur</option><option value="x">Tanpa target</option></select>
<select id="pi" aria-label="Filter hari tanpa penjualan"><option value="">Semua promotor</option><option value="2">Tanpa jual 2 hari atau lebih</option><option value="3">Tanpa jual 3 hari atau lebih</option><option value="4">Tanpa jual 4 hari atau lebih</option><option value="5">Tanpa jual 5 hari atau lebih</option><option value="7">Tanpa jual 7 hari atau lebih</option></select>
<select id="po" aria-label="Urutkan"><option value="est">Urut: estimasi terendah</option><option value="esth">Urut: estimasi tertinggi</option><option value="idl">Urut: paling lama tidak jual</option><option value="ach">Urut: achieve terbanyak</option><option value="tgt">Urut: target terbesar</option><option value="nm">Urut: nama promotor</option></select>
</div></div>
<div class="sm cnt" id="pcnt" role="status"></div>
<div class="box"><div class="scroll"><table id="ptbl"></table></div></div>
</div>
<div id="aview" hidden><div class="box"><div class="scroll"><table id="atbl"></table></div></div></div>
<div class="box" id="detbox" hidden><div class="det" id="det"></div></div>
<div class="note" id="note"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DEMO=null;
const DEMO_S=null;
const DEMO_A=null;
const DEMO_U=null;
const DEMO_P=null;
let D,N,M,TG;
function setD(d){D=d;N=d.days;M=d.total;TG=N/M;sel=null}
let SRC='Contoh tampilan memakai data dari Excel revisi. Unggah file di atas untuk menghitung dari data mentah.';
const $=s=>document.querySelector(s);
const fm=(x,d=0)=>x==null?'–':x.toLocaleString('id-ID',{maximumFractionDigits:d});
const pc=x=>x==null?'–':fm(x*100,1)+'%';
const estc=r=>`${pc(r.estp)}<span class="eu">≈ ${fm(r.est,Math.abs(r.est)<10?1:0)} unit</span>`;
const NAMES={all:'Semua tipe',m3:'3MIO+',v80:'V80 Lite'};
const TT={all:3500};
let tab='all',sel=null;
function calc(r){
  const t=r.t,a=r.a,s=[...r.d].sort((x,y)=>x-y),med=s[Math.floor(s.length/2)],mx=s[s.length-1];
  return {...r,pct:t?a/t:null,est:a/N*M,estp:t?a/N*M/t:null,gap:a-t*TG,need:t?Math.max(t-a,0)/(M-N):null,avg:a/N,spike:(mx>=30&&mx>=5*med)?r.d.indexOf(mx)+1:0};
}
function insentif(r){const e=r.estp;return e==null?['–','n']:e>.9?['Sesuai %','g']:e>.7?['Ins 50%','m']:['HANGUS','b'];}
function bonus(r){if(r.estp==null)return['–','n'];if(r.pct>=1)return['Tercapai','g'];return r.estp>=1?['On track','m']:['HANGUS','b'];}
function data(){
  const L=D.types[tab].map(calc),L3=D.types.m3.map(calc);
  return L.map((r,i)=>({...r,i,st:tab==='v80'?bonus(r):insentif(L3[i])}));
}
function total(L){
  const d=Array(N).fill(0);L.forEach(r=>r.d.forEach((v,k)=>d[k]+=v));
  return calc({n:'TSD',t:L.reduce((s,r)=>s+r.t,0),a:L.reduce((s,r)=>s+r.a,0),d});
}
function renderEmpty(){
  $('#vtabs').innerHTML='';['#lview','#sview','#pview','#aview'].forEach(q=>$(q).hidden=true);
  $('#tabs').style.display='none';$('.leg').style.display='none';$('#detbox').hidden=true;$('#strip').innerHTML='';
  $('#strip').style.display='none';$('#sub').textContent='Belum ada data.';
  $('#note').innerHTML='<p>Buka bagian Hitung dari file di atas, pilih file SCAN AKTIF (wajib) dan file target toko serta target promotor, lalu klik Hitung pencapaian. Semua perhitungan dilakukan di browser Anda, file tidak dikirim ke mana pun.</p><p>Hasil hitungan diingat di browser dan perangkat yang Anda pakai. Di perangkat lain, unggah ulang filenya.</p>';
}
function render(){
  if(!D){renderEmpty();return}
  $('#strip').style.display='';
  $('#vtabs').innerHTML=[['leader','Per leader'],['store','Per toko'],['pro','Per promotor'],['act','Follow up aktivasi'],['uns','Aktif belum scan']].map(([k,l])=>`<button data-v="${k}" aria-pressed="${k===view}">${l}</button>`).join('');
  $('#lview').hidden=view!=='leader';$('#sview').hidden=view!=='store';$('#pview').hidden=view!=='pro';$('#aview').hidden=view!=='act'&&view!=='uns';
  const wide=view==='act'||view==='uns';$('#tabs').style.display=wide?'none':'';$('.leg').style.display=wide?'none':'';
  if(view==='store')renderStore();else if(view==='pro')renderPro();else if(view==='act')renderAct();else if(view==='uns')renderUns();else renderLeader();
}
function renderLeader(){
  $('#sub').textContent='Data sampai tanggal '+N+' dari '+M+' hari. Time gone '+pc(TG)+'.';
  $('#tabs').innerHTML=Object.keys(NAMES).map(k=>`<button data-k="${k}" aria-pressed="${k===tab}">${NAMES[k]}</button>`).join('');
  const L=data(),T0=total(L),T=TT[tab]?calc({...T0,t:TT[tab]}):T0;
  const cnt=k=>L.filter(r=>r.st[0]===k).length;
  const labs=tab==='v80'?['Tercapai','On track','HANGUS']:['Sesuai %','Ins 50%','HANGUS'];
  const warn=L.filter(r=>r.spike||(r.estp!=null&&r.estp<.7));
  $('#strip').innerHTML=
   `<div><div class="lab">Pencapaian TSD, ${NAMES[tab]}</div><div class="big">${pc(T.pct)}</div><div class="sm">${fm(T.a)} dari target ${fm(T.t)}</div><div class="sm">Target per hari: <b>${fm(T.need,1)}</b> untuk sisa ${M-N} hari (ideal ${fm(T.t/M,1)} per hari)</div></div>`+
   `<div><div class="lab">Estimasi akhir periode</div><div class="big">${pc(T.estp)}</div><div class="sm">sekitar ${fm(T.est)}, ${T.gap>=0?'di depan':'di belakang'} jalur ${fm(Math.abs(T.gap))}</div></div>`+
   `<div><div class="lab">${tab==='v80'?'Bonus V80 Lite':'Status insentif (dari 3MIO+)'}</div><div class="big">${labs.map(k=>cnt(k)).join(' / ')}</div><div class="sm">${labs.join(' / ')}</div></div>`+
   `<div><div class="lab">Perlu perhatian</div><div class="big">${warn.length}</div><div class="sm">${warn.length?warn.map(r=>r.n.split(' ')[0]).join(', '):'tidak ada'}</div></div>`;
  const S=[...L].sort((a,b)=>(a.estp==null)-(b.estp==null)||a.estp-b.estp);
  $('#tbl').innerHTML=`<thead><tr><th>Leader</th><th class="l">Pencapaian (garis hitam: time gone)</th><th>Target</th><th>Achieve</th><th>Perlu per hari</th><th>Estimasi</th><th class="l">Status</th><th class="l"></th></tr></thead><tbody>`+
   S.map(r=>`<tr tabindex="0" data-i="${r.i}" class="lr ${sel===r.i?'on':''}"><td><div class="nm">${r.n}</div><div class="tm">${r.g}</div></td>`+
   `<td class="l"><div class="pb"><div class="trk"><div class="fil ${r.pct!=null&&r.pct<TG?'lag':''}" style="width:${Math.min(r.pct||0,1)*100}%"></div><div class="tick" style="left:${TG*100}%"></div></div><span>${pc(r.pct)}</span></div></td>`+
   `<td>${fm(r.t)}</td><td>${fm(r.a)}</td><td>${fm(r.need,1)}</td><td>${estc(r)}</td><td class="l"><span class="pill ${r.st[1]}">${r.st[0]}</span></td><td class="l flag">${r.spike?'Lonjakan tgl '+r.spike:''}</td></tr>`+daily(r)).join('')+`</tbody>`;
  const r=L.find(x=>x.i===sel);
  $('#detbox').hidden=!r;
  if(r)$('#det').innerHTML=detail(r);

let NDB=null,NMODE='wait',NRO=false,NLOAD=false,NSTALE=false,NERR=false;
function hid(n){let v=HC.get(n);if(v)return v;const s=nk(n);let a=0xdeadbeef,b=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);
  b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  v='s'+(4294967296*(2097151&b)+(a>>>0)).toString(36);HC.set(n,v);SN.set(v,String(n));return v}
const noteText=n=>{const id=hid(n);return DRAFT.has(id)?DRAFT.get(id):(NOTES.get(id)||{text:''}).text};
const hasNote=n=>noteText(n).trim()!=='';
const nlock=()=>NRO||NMODE==='wait'||(NLOAD&&!NSTALE);
const fmtAt=t=>{try{return t?new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}catch(e){return ''}};
const nmeta=id=>{const x=NOTES.get(id);return x&&x.text?'Disimpan '+fmtAt(x.at):''};
function nstat(id,t,er){const e=document.querySelector('[data-ns="'+id+'"]');if(e){e.textContent=t;e.className='ns'+(er?' er':'')}}
function autosize(t){if(!t.offsetParent)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,320)+'px'}
function autosizeAll(){document.querySelectorAll('#stbl textarea.nt').forEach(t=>{if(t.value)autosize(t)})}
function ncell(r){const id=hid(r.n),lk=nlock();
  return `<td class="nc l"><textarea class="nt" data-id="${id}" rows="2" maxlength="2000" placeholder="${lk&&!NRO?'Memuat catatan':'Tulis catatan'}" aria-label="Catatan toko ${esc(r.n)}"${lk?' readonly':''}>\n${esc(noteText(r.n))}</textarea><span class="ns" data-ns="${id}">${DRAFT.has(id)?'Belum disimpan':nmeta(id)}</span></td>`}
function nline(){const e=$('#nmsg');if(!e)return;
  const c=ST?ST.stores.filter(s=>hasNote(s.n)).length:0;let t;
  if(NMODE==='wait'||NLOAD)t='Memuat catatan…'+(NSTALE?' Penyimpanan catatan belum bisa dijangkau, jadi data yang tampil mungkin belum terbaru.':'');
  else t=(NMODE==='local'?'Penyimpanan bersama tidak tersedia di tampilan ini, jadi catatan hanya tersimpan di browser ini. ':(NRO?'':'Catatan tersimpan otomatis. '))+fm(c)+' toko sudah ada catatan.';
  if(NERR)t+=' Catatan tidak bisa dimuat dari penyimpanan.';
  if(NRO)t+=' Hanya pemilik dan editor yang bisa mengubah catatan.';
  e.textContent=t}
function lockAll(){const lk=nlock();document.querySelectorAll('#stbl textarea.nt').forEach(t=>{t.readOnly=lk;t.placeholder=lk&&!NRO?'Memuat catatan':'Tulis catatan'})}
function applyNotes(){document.querySelectorAll('#stbl textarea.nt').forEach(t=>{const id=t.dataset.id;if(DRAFT.has(id)||BUSY.has(id)||document.activeElement===t)return;const v=(NOTES.get(id)||{text:''}).text;if(t.value!==v){t.value=v;autosize(t)}nstat(id,nmeta(id))})}
const lsRead=()=>{try{return JSON.parse(localStorage.getItem(LSK)||'{}')||{}}catch(e){return {}}};
const flushAll=()=>[...DRAFT.keys()].forEach(save);
async function save(id){
  clearTimeout(TMR.get(id));
  if(!DRAFT.has(id)||BUSY.has(id)||nlock())return;
  const val=DRAFT.get(id).replace(/\s+$/,''),old=NOTES.get(id);
  if(val===(old?old.text:'')){DRAFT.delete(id);nstat(id,nmeta(id));nline();return}
  BUSY.add(id);nstat(id,'Menyimpan…');
  const at=Date.now(),name=SN.get(id)||'';
  try{
    if(NMODE==='db'){
      const ref=NDB.collection('notes').doc(id),w=()=>val===''?ref.delete():ref.set({n:name,text:val,at});
      try{await w()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,500+Math.random()*900));await w()}else throw e}
    }else{
      const o=lsRead();if(val==='')delete o[id];else o[id]={n:name,text:val,at};localStorage.setItem(LSK,JSON.stringify(o));
    }
    if(val==='')NOTES.delete(id);else NOTES.set(id,{n:name,text:val,at});
    if(DRAFT.has(id)&&DRAFT.get(id).replace(/\s+$/,'')===val)DRAFT.delete(id);
    nstat(id,DRAFT.has(id)?'Belum disimpan':nmeta(id));
  }catch(e){
    const c=e&&e.code;
    if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){NRO=true;lockAll()}
    nstat(id,c==='quota_exceeded'?'Penyimpanan penuh, catatan tidak tersimpan.':NRO?'Tidak tersimpan: tidak punya izin mengubah.':'Gagal menyimpan. Klik di luar kolom untuk mencoba lagi.',1);
    BUSY.delete(id);nline();return
  }
  BUSY.delete(id);nline();
  if(DRAFT.has(id))save(id)
}
document.addEventListener('input',e=>{const t=e.target;if(!(t.classList&&t.classList.contains('nt')))return;
  const id=t.dataset.id;DRAFT.set(id,t.value);autosize(t);nstat(id,'Belum disimpan');
  clearTimeout(TMR.get(id));TMR.set(id,setTimeout(()=>save(id),900))});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('nt'))save(t.dataset.id)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
addEventListener('pagehide',flushAll);
function onNotes(snap){
  const keep=new Map();
  snap.docs.forEach(d=>{const v=d.data()||{};if(typeof v.text==='string'&&v.text.trim())keep.set(d.id,{n:String(v.n||''),text:v.text,at:+v.at||0})});
  NOTES.clear();keep.forEach((v,k)=>NOTES.set(k,v));
  if(NLOAD&&!snap.metadata.fromCache){NLOAD=false;NSTALE=false;lockAll();flushAll()}
  applyNotes();nline()}
async function initNotes(){
  let db=null,user=null;
  try{if(window.claude&&claude.use)db=await claude.use('db')}catch(e){}
  try{if(db)user=await claude.use('user')}catch(e){}
  if(!db){
    NMODE='local';NLOAD=false;const o=lsRead();
    Object.keys(o).forEach(k=>{const v=o[k];if(v&&typeof v.text==='string'&&v.text)NOTES.set(k,{n:String(v.n||''),text:v.text,at:+v.at||0})});
    lockAll();applyNotes();nline();flushAll();loadLocal();return}
  let can=null;try{if(user)can=await user.canEdit()}catch(e){}
  if(can===false)NRO=true;
  SNAPDB=db;SNAPCAN=can;SNAPT=Date.now();snapLoad(true);
  NDB=db;NMODE='db';NLOAD=true;lockAll();nline();
  const NT=setTimeout(()=>{if(NLOAD){NSTALE=true;lockAll();nline();flushAll()}},10000);
  const fail=e=>{clearTimeout(NT);NLOAD=false;NSTALE=false;NERR=true;if(e&&e.code==='revoked')NRO=true;lockAll();nline();flushAll()};
  try{db.collection('notes').onSnapshot(snap=>{onNotes(snap);if(!NLOAD)clearTimeout(NT)},fail)}catch(e){fail(e)}
}
/* ===== Simpan hasil upload: db bersama (semua perangkat), cadangan localStorage ===== */
const SK='snap_v1',SPARTS=['D','S','P','A','U'],SNAPDEF=$('#umsg').textContent;
let SNAPDB=null,SNAPCAN=null,SNAPV=null,SNAPBUSY=false,SNAPLOAD=false,SNAPT=0;
const dkey=d=>d?`${d.y||0}-${String(d.m||0).padStart(2,'0')}-${String(d.days||0).padStart(2,'0')}`:'';
const tmo=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no({code:'timeout'}),ms))]);
function applyData(r,reset){setD(r.D);setS(r.S);setP(r.P);setA(r.A);setU(r.U||null);SRC=r.msg;STSRC=r.ts;PSRC=r.pts;if(reset)tab='all';sel=null;render()}
function snapApply(meta,o){
  if(!o||!o.D||!o.S||!o.P||!o.A)return false;
  if(dkey(o.D)<dkey(DEMO))return false;
  applyData({D:o.D,S:o.S,P:o.P,A:o.A,U:o.U||null,msg:meta.msg||'',ts:meta.ts||'',pts:meta.pts||''},false);
  SNAPV=meta.v;$('#updet').open=false;
  $('#umsg').textContent='Memakai data dari upload terakhir ('+fmtAt(meta.at)+'). '+[meta.msg,meta.ts,meta.pts].filter(Boolean).join(' ');
  return true}
async function saveSnap(r){
  SNAPBUSY=true;
  try{
    const at=Date.now(),v=String(at),meta={v,at,msg:r.msg||'',ts:r.ts||'',pts:r.pts||'',dk:dkey(r.D)},parts={D:r.D,S:r.S,P:r.P,A:r.A,U:r.U||null};
    if(SNAPDB){
      if(SNAPCAN===false)return 'ro';
      const w=async(id,data)=>{const ref=SNAPDB.collection('snap').doc(id);
        try{await ref.set(data)}catch(e){if(e&&e.code==='unavailable'){await new Promise(x=>setTimeout(x,500+Math.random()*900));await ref.set(data)}else throw e}};
      for(const k of SPARTS)await w(k,{v,json:JSON.stringify(parts[k])});
      await w('meta',meta);
      SNAPV=v;return 'db'}
    try{localStorage.setItem(SK,JSON.stringify({meta,parts}));return 'local'}catch(e){return 'none'}
  }finally{SNAPBUSY=false}}
function snapNote(h){
  if(h==='db')return 'Sudah disimpan, jadi tampil juga di HP dan perangkat lain.';
  if(h==='local')return 'Disimpan di browser ini saja.';
  if(h==='none')return 'Tidak bisa disimpan di browser ini.';
  if(h==='ro'||h==='err:not_granted'||h==='err:revoked')return 'Belum disimpan untuk perangkat lain: hanya pemilik dan editor yang bisa menyimpan.';
  if(h==='err:quota_exceeded')return 'Gagal menyimpan: penyimpanan halaman penuh.';
  if(h==='err:invalid_argument')return 'Gagal menyimpan: data terlalu besar.';
  return 'Gagal menyimpan untuk perangkat lain'+(h&&h.length>4?' ('+h.slice(4)+')':'')+'. Klik Hitung pencapaian lagi.'}
async function snapGet(){
  const col=SNAPDB.collection('snap'),m=await col.doc('meta').get();
  if(!m.exists)return null;
  const mt=m.data()||{};
  if(mt.v===SNAPV)return 'same';
  const ds=await Promise.all(SPARTS.map(k=>col.doc(k).get())),o={};
  for(let i=0;i<SPARTS.length;i++){const d=ds[i].exists?ds[i].data():null;if(!d){if(SPARTS[i]==='U'){o.U=null;continue}return 'retry'}if(d.v!==mt.v)return 'retry';o[SPARTS[i]]=JSON.parse(d.json)}
  return {meta:mt,o}}
async function snapLoad(first){
  if(!SNAPDB||SNAPBUSY||SNAPLOAD)return;
  SNAPLOAD=true;const u=$('#umsg');
  if(first)u.textContent='Memuat data terbaru…';
  try{
    let g=await tmo(snapGet(),10000);
    if(g==='retry'){await new Promise(x=>setTimeout(x,1500));g=await tmo(snapGet(),10000)}
    const ok=g&&g!=='same'&&g!=='retry'&&snapApply(g.meta,g.o);
    if(first&&!ok&&g!=='same')u.textContent=SNAPDEF
  }catch(e){if(first)u.textContent='Data terbaru belum bisa dimuat'+(DEMO?', jadi ditampilkan data bawaan sampai tanggal '+DEMO.days+'.':'.')}
  SNAPLOAD=false}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&j.meta&&j.parts)snapApply(j.meta,j.parts)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SNAPDB&&Date.now()-SNAPT>30000){SNAPT=Date.now();snapLoad(false)}});
if(DEMO){setD(DEMO);setS(DEMO_S);setP(DEMO_P);setA(DEMO_A);setU(DEMO_U)}else $('#updet').open=true;
render();initNotes();
</script>
